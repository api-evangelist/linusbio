tool_count: 13
tools:
- name: search_catalog
  category: catalog
  description: Search for products from the online store, hosted on Shopify.
- name: lookup_catalog
  category: catalog
  description: Look up multiple products or variants by identifier.
- name: get_product
  category: catalog
  description: Retrieve complete product detail by identifier. Returns a singular product.
- name: get_cart
  category: cart
  description: Get the cart contents.
- name: create_cart
  category: cart
  description: Creates a new cart.
- name: update_cart
  category: cart
  description: Perform updates to a cart.
- name: cancel_cart
  category: cart
  description: Cancels a cart.
- name: get_checkout
  category: checkout
  description: >-
    Returns details about the checkout, including line items, totals, and any applicable
    discounts or taxes.
- name: create_checkout
  category: checkout
  description: Creates a checkout.
- name: update_checkout
  category: checkout
  description: Updates a checkout.
- name: complete_checkout
  category: checkout
  description: >-
    Completes a checkout and returns the checkout result, including order ID and Thank You
    Page URL. Accepts an optional meta.idempotency-key.
- name: cancel_checkout
  category: checkout
  description: Cancels a checkout.
- name: get_order
  category: order
  description: Get the details of an order.

runtime_rules:
  human_approval_required: true
  human_approval_note: >-
    Both agents.md and robots.txt state that agents must not complete payment without an
    explicit, contemporaneous buyer approval step.
  idempotency:
    supported: true
    surface: complete_checkout
    parameter: meta.idempotency-key
    type: string
    description: An idempotency key for completing the checkout.
  money_encoding: >-
    All prices are integers in the currency's ISO 4217 minor units paired with a currency
    code; e.g. {"amount":2500,"currency":"USD"} is $25.00.
  rate_limits: >-
    robots.txt states the MCP endpoint is rate-limited per IP and that agents should back off
    on 429. No numeric limit is published.

authentication:
  anonymous_tools_list: true
  customer_account_oauth:
    metadata: https://traced.life/.well-known/oauth-authorization-server
    protected_resource: https://traced.life/.well-known/oauth-protected-resource
    scopes:
    - customer-account-mcp-api:full
    note: >-
      A separate, authenticated Shopify Customer Account MCP surface exists behind OAuth
      (scope customer-account-mcp-api:full). It was NOT probed — it requires customer
      credentials — so no tool list is recorded for it.
