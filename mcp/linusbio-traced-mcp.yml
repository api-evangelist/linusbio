name: Traced UCP Commerce MCP Server
provider: LinusBio (Linus Biotechnology Inc.)
summary: LinusBio's Traced consumer storefront at traced.life exposes a live, anonymous MCP endpoint implementing
  the Universal Commerce Protocol (UCP). A POST of tools/list returns HTTP 200 with 13 tools and full
  JSON Schema 2020-12 input schemas. This is the ONLY machine-callable surface LinusBio publishes anywhere
  — the corporate site, ClearStrand-ASD site and every api./docs./ developer. subdomain return the marketing
  site via wildcard DNS.
ownership:
  note: traced.life is named as the ordering site for the Traced test in LinusBio's own 2026-07-07 press
    release ("To order Traced and for more information, please visit www.traced.life"), and the storefront
    footer links to LinusBio's LinkedIn company page. The store entity of record in the Shopify copyright
    notice is "Traced Ltd.".
  evidence:
  - https://www.linusbio.com/news/linusbio-launches-traced-the-first-consumer-wellness-test-to-track-environmental-exposures-over-time
  - https://traced.life/
platform_note: This server is provided by the Shopify platform, not authored by LinusBio. Every Shopify
  storefront on UCP 2026-04-08 serves the same 13-tool surface. It is recorded here because it is genuinely
  served from a LinusBio-controlled domain and is genuinely callable by an agent today. It exposes commerce
  only — no exposomics, laboratory, specimen or test-result data.
