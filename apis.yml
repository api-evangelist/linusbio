apis:
- aid: linusbio:linusbio-traced-ucp-commerce
  name: Traced UCP Commerce (MCP)
  description: 'The agent-callable commerce surface for LinusBio''s Traced environmental exposure test,
    served from the traced.life storefront. It implements the Universal Commerce Protocol (UCP) 2026-04-08
    over MCP: an anonymous tools/list returns 13 tools with JSON Schema 2020-12 input schemas covering
    catalog search and lookup, cart lifecycle, checkout lifecycle and order retrieval. Payment completion
    requires contemporaneous human approval. This surface is provided by the Shopify platform on a LinusBio-controlled
    domain; it is not a LinusBio-authored API and it does not expose any exposomics, laboratory or test-result
    data.'
