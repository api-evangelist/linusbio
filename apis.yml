aid: linusbio
name: LinusBio
description: LinusBio (Linus Biotechnology Inc.) is a New York-based precision-medicine company spun out
  of the Mount Sinai Institute for Exposomic Research that commercializes "temporal exposomics sequencing"
  — a robotics, laser-ablation and mass-spectrometry platform that reads a single strand of hair like
  growth rings to reconstruct hundreds of time-resolved measurements of a person's chemical and biological
  exposures, then runs them through an AI pipeline to produce biomarkers. Its clinical product ClearStrand-ASD
  (formerly StrandDx-ASD) is an FDA Breakthrough Device-designated laboratory developed test run in a
  CLIA-certified lab to help rule out autism spectrum disorder in children from one month to ten years
  of age, and its consumer product Traced is a $299 at-home environmental exposure test measuring 15 elements
  across a 30-day timeline. LinusBio publishes no developer program, no OpenAPI and no public REST API;
  its only machine-callable surface is the Shopify-hosted Universal Commerce Protocol (UCP) MCP endpoint
  on the traced.life storefront, through which an agent can search the catalog, build a cart and open
  a checkout for the Traced test under a buyer-approval rule.
